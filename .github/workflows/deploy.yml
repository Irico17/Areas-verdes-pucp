name: deploy

# develop: push a develop o a backend/arquitectura-equipo, después de que ci esté en verde.
# qa: tag rc-* o workflow_dispatch.
# produccion: solo workflow_dispatch. El environment `produccion` pide aprobación
# (required reviewers en la configuración del ambiente; no se puede declarar en YAML).
on:
  push:
    branches:
      - develop
      - backend/arquitectura-equipo
    tags:
      - "rc-*"
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        required: true
        type: choice
        options:
          - develop
          - qa
          - produccion
      ref:
        description: Rama, tag o SHA. Vacío usa el commit de esta ejecución.
        required: false
        type: string
        default: ""
      rollback:
        description: Tag de imagen para volver atrás (SHA de 40 hex o rc-*). Vacío despliega ref.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || github.ref }}
  cancel-in-progress: false

jobs:
  resolver:
    runs-on: ubuntu-24.04
    outputs:
      ambiente: ${{ steps.out.outputs.ambiente }}
      ref: ${{ steps.out.outputs.ref }}
      rollback: ${{ steps.out.outputs.rollback }}
    steps:
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AMBIENTE: ${{ inputs.ambiente }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ROLLBACK: ${{ inputs.rollback }}
          DEFAULT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          valido() {
            case "$1" in
              ""|*[!A-Za-z0-9._/-]*) return 1 ;;
            esac
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ambiente="$INPUT_AMBIENTE"
            ref="$INPUT_REF"
            rollback="$INPUT_ROLLBACK"
            if [ -z "$ref" ]; then
              ref="$DEFAULT_SHA"
            fi
          elif [[ "$REF" == refs/tags/rc-* ]]; then
            ambiente="qa"
            ref="$DEFAULT_SHA"
            rollback=""
          else
            ambiente="develop"
            ref="$DEFAULT_SHA"
            rollback=""
          fi
          case "$ambiente" in
            develop|qa|produccion) ;;
            *)
              echo "ambiente no permitido: $ambiente" >&2
              exit 2
              ;;
          esac
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$ambiente" = "produccion" ]; then
            echo "producción solo se despliega a mano" >&2
            exit 2
          fi
          if ! valido "$ref"; then
            echo "ref no permitida" >&2
            exit 2
          fi
          if [ -n "$rollback" ] && ! valido "$rollback"; then
            echo "rollback no permitido" >&2
            exit 2
          fi
          if [ -n "$rollback" ] && ! [[ "$rollback" =~ ^[0-9a-f]{40}$ || "$rollback" =~ ^rc-[A-Za-z0-9._-]+$ ]]; then
            echo "el rollback tiene que ser un SHA de 40 hex o un tag rc-*" >&2
            exit 2
          fi
          echo "ambiente=$ambiente" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"

  esperar-ci:
    needs: resolver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolver.outputs.ref }}
      - name: Esperar CI en verde para este SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          bash deploy/esperar_ci.sh "$sha"

  deploy:
    needs: [resolver, esperar-ci]
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolver.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolver.outputs.ref }}
      - uses: hashicorp/setup-terraform@v4
      - name: Entrar a GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar
        id: desplegar
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_dev_password: ${{ secrets.TF_VAR_dev_password }}
          CAMPUS_CORS_ORIGINS: ${{ vars.CAMPUS_CORS_ORIGINS }}
          CAMPUS_COOKIE_SECURE: ${{ vars.CAMPUS_COOKIE_SECURE }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AMBIENTE: ${{ needs.resolver.outputs.ambiente }}
          ROLLBACK_TAG: ${{ needs.resolver.outputs.rollback }}
          DEPLOY_AWS_CONFIRM: "1"
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Ambiente: $AMBIENTE"
          echo "SHA: $sha"
          echo "Evento: ${EVENT_NAME:-desconocido}"

          omitir_o_fallar() {
            local motivo="$1"
            if [ "${EVENT_NAME:-}" = "workflow_dispatch" ] || [ "$AMBIENTE" = "produccion" ]; then
              echo "::error::$motivo" >&2
              exit 1
            else
              echo "::warning::$motivo"
              if [ -n "${GITHUB_OUTPUT:-}" ]; then
                echo "desplegado=false" >> "$GITHUB_OUTPUT"
              fi
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                {
                  echo "### Despliegue en $AMBIENTE: OMITIDO"
                  echo ""
                  echo "$motivo"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
          }

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${AWS_SESSION_TOKEN:-}" ]; then
            omitir_o_fallar "Faltan credenciales de AWS (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) para el ambiente $AMBIENTE."
          fi
          if [ -z "${TF_VAR_db_password:-}" ] || [ -z "${TF_VAR_dev_password:-}" ]; then
            omitir_o_fallar "Faltan secretos TF_VAR_db_password o TF_VAR_dev_password para el ambiente $AMBIENTE."
          fi
          args=( "$AMBIENTE" --aws --sha "$sha" )
          if [ -n "${ROLLBACK_TAG:-}" ]; then
            args+=( --rollback "$ROLLBACK_TAG" )
          fi
          bash deploy/deploy.sh "${args[@]}"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "desplegado=true" >> "$GITHUB_OUTPUT"
          fi
