name: deploy

# develop: push a rama develop o workflow_dispatch.
# qa: tag rc-* o workflow_dispatch (requiere promoción: despliegue previo exitoso en develop).
# produccion: solo workflow_dispatch (requiere promoción: despliegue previo exitoso en qa, y
#             aprobación manual mediante Required Reviewers configurado en el environment de GitHub;
#             opcionalmente se puede activar un wait-timer).
# Despliegues ejecutados en runners self-hosted en cada instancia EC2.
# Las etiquetas no dependen de la cuenta de AWS. Si hiciera falta otra,
# defina las variables de repositorio RUNNER_LABEL_DEVELOP, RUNNER_LABEL_QA
# y RUNNER_LABEL_PRODUCCION. La URL pública sale de vars.PUBLIC_URL del
# environment (develop, qa o produccion), no de una IP escrita en este archivo.
#   develop    -> [self-hosted, campus-develop]
#   qa         -> [self-hosted, campus-qa]
#   produccion -> [self-hosted, campus-prod]
# Timeout del job de despliegue: 30 minutos. Si el runner self-hosted no está disponible,
# el job permanece en cola y no se marca como exitoso artificialmente.

on:
  push:
    branches:
      - develop
    tags:
      - "rc-*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        required: true
        type: choice
        options:
          - develop
          - qa
          - produccion
      ref:
        description: Rama, tag o SHA. Vacío usa el commit de esta ejecución.
        required: false
        type: string
        default: ""
      rollback:
        description: Tag de imagen para volver atrás (SHA de 40 hex o rc-*). Vacío despliega ref.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  deployments: read
  packages: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || (startsWith(github.ref, 'refs/tags/rc-') && 'qa' || 'develop') }}
  cancel-in-progress: false

jobs:
  resolver:
    runs-on: ubuntu-24.04
    outputs:
      ambiente: ${{ steps.out.outputs.ambiente }}
      ref: ${{ steps.out.outputs.ref }}
      rollback: ${{ steps.out.outputs.rollback }}
      runner_label: ${{ steps.out.outputs.runner_label }}
    steps:
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AMBIENTE: ${{ inputs.ambiente }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ROLLBACK: ${{ inputs.rollback }}
          DEFAULT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUNNER_LABEL_DEVELOP: ${{ vars.RUNNER_LABEL_DEVELOP }}
          RUNNER_LABEL_QA: ${{ vars.RUNNER_LABEL_QA }}
          RUNNER_LABEL_PRODUCCION: ${{ vars.RUNNER_LABEL_PRODUCCION }}
        run: |
          set -euo pipefail
          valido() {
            case "$1" in
              ""|*[!A-Za-z0-9._/-]*) return 1 ;;
            esac
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ambiente="$INPUT_AMBIENTE"
            ref="$INPUT_REF"
            rollback="$INPUT_ROLLBACK"
            if [ -z "$ref" ]; then
              ref="$DEFAULT_SHA"
            fi
          elif [[ "$REF" == refs/tags/rc-* ]]; then
            ambiente="qa"
            ref="$DEFAULT_SHA"
            rollback=""
          else
            ambiente="develop"
            ref="$DEFAULT_SHA"
            rollback=""
          fi
          case "$ambiente" in
            develop|qa|produccion) ;;
            *)
              echo "ambiente no permitido: $ambiente" >&2
              exit 2
              ;;
          esac
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$ambiente" = "produccion" ]; then
            echo "producción solo se despliega a mano" >&2
            exit 2
          fi
          if ! valido "$ref"; then
            echo "ref no permitida" >&2
            exit 2
          fi
          if [ -n "$rollback" ] && ! valido "$rollback"; then
            echo "rollback no permitido" >&2
            exit 2
          fi
          if [ -n "$rollback" ] && ! [[ "$rollback" =~ ^[0-9a-f]{40}$ || "$rollback" =~ ^rc-[A-Za-z0-9._-]+$ ]]; then
            echo "el rollback tiene que ser un SHA de 40 hex o un tag rc-*" >&2
            exit 2
          fi

          case "$ambiente" in
            develop) runner_label="${RUNNER_LABEL_DEVELOP:-campus-develop}" ;;
            qa) runner_label="${RUNNER_LABEL_QA:-campus-qa}" ;;
            produccion) runner_label="${RUNNER_LABEL_PRODUCCION:-campus-prod}" ;;
          esac
          case "$runner_label" in
            ""|*[!A-Za-z0-9._-]*)
              echo "etiqueta de runner no permitida" >&2
              exit 2
              ;;
          esac

          {
            echo "ambiente=$ambiente"
            echo "ref=$ref"
            echo "rollback=$rollback"
            echo "runner_label=$runner_label"
          } >> "$GITHUB_OUTPUT"

  esperar-ci:
    needs: resolver
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolver.outputs.ref }}
      - id: commit
        name: Resolver SHA exacto del commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Esperar CI en verde para este SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.commit.outputs.sha }}"
          bash deploy/esperar_ci.sh "$sha"

  promocion:
    needs: [resolver, esperar-ci]
    runs-on: ubuntu-24.04
    steps:
      - name: Validar promoción de despliegue por SHA
        id: validar-promocion
        env:
          AMBIENTE: ${{ needs.resolver.outputs.ambiente }}
          SHA: ${{ needs.esperar-ci.outputs.sha }}
          ROLLBACK: ${{ needs.resolver.outputs.rollback }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$ROLLBACK" ]; then
            if ! [[ "$ROLLBACK" =~ ^[0-9a-f]{40}$ || "$ROLLBACK" =~ ^rc-[A-Za-z0-9._-]+$ ]]; then
              echo "el rollback tiene que ser un SHA de 40 hex o un tag rc-*" >&2
              exit 2
            fi
            echo "Rollback explícito a '$ROLLBACK'. Se omite la exigencia de despliegue previo de $SHA."
            exit 0
          fi

          case "$AMBIENTE" in
            develop)
              echo "Ambiente develop no requiere promoción previa."
              exit 0
              ;;
            qa)
              PREV_ENV="develop"
              ;;
            produccion)
              PREV_ENV="qa"
              ;;
            *)
              echo "ambiente no permitido: $AMBIENTE" >&2
              exit 2
              ;;
          esac

          echo "Validando promoción de $SHA hacia $AMBIENTE (requiere despliegue exitoso en $PREV_ENV)..."

          deployments="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=$PREV_ENV")"
          num_deps="$(python3 -c 'import json, sys; d = json.loads(sys.argv[1] or "[]"); print(len(d) if isinstance(d, list) else 0)' "$deployments")"

          if [ "$num_deps" -eq 0 ]; then
            echo "Promoción rechazada: el commit $SHA no tiene ningún despliegue previo en el ambiente '$PREV_ENV'." >&2
            exit 1
          fi

          dep_ids="$(python3 -c 'import json, sys; d = json.loads(sys.argv[1] or "[]"); print(" ".join(str(x["id"]) for x in d if "id" in x))' "$deployments")"

          success=0
          for id in $dep_ids; do
            statuses="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses")"
            last_state="$(python3 -c 'import json, sys; s = json.loads(sys.argv[1] or "[]"); print(s[0].get("state", "") if isinstance(s, list) and len(s) > 0 else "")' "$statuses")"
            if [ "$last_state" = "success" ]; then
              success=1
              break
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "Promoción rechazada: ningún despliegue del commit $SHA en '$PREV_ENV' concluyó con status 'success'." >&2
            exit 1
          fi

          echo "Promoción validada: el commit $SHA cuenta con despliegue exitoso en '$PREV_ENV'."

  deploy:
    needs: [resolver, esperar-ci, promocion]
    runs-on: [self-hosted, "${{ needs.resolver.outputs.runner_label }}"]
    environment:
      name: ${{ needs.resolver.outputs.ambiente }}
      url: ${{ vars.PUBLIC_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.esperar-ci.outputs.sha }}
      - name: Iniciar sesión en GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar en el host
        id: desplegar
        env:
          AMBIENTE: ${{ needs.resolver.outputs.ambiente }}
          SHA: ${{ needs.esperar-ci.outputs.sha }}
          ROLLBACK_TAG: ${{ needs.resolver.outputs.rollback }}
        run: |
          set -euo pipefail
          args=( "$AMBIENTE" --sha "$SHA" )
          if [ -n "$ROLLBACK_TAG" ]; then
            args+=( --rollback "$ROLLBACK_TAG" )
          fi
          bash deploy/host-deploy.sh "${args[@]}"
      - name: Cerrar sesión en GHCR
        if: always()
        run: docker logout ghcr.io || true
      - name: Resumen de despliegue
        if: always()
        env:
          AMBIENTE: ${{ needs.resolver.outputs.ambiente }}
          SHA: ${{ needs.esperar-ci.outputs.sha }}
          ROLLBACK_TAG: ${{ needs.resolver.outputs.rollback }}
        run: |
          {
            echo "### Despliegue en $AMBIENTE"
            echo "- **SHA:** \`$SHA\`"
            if [ -n "$ROLLBACK_TAG" ]; then
              echo "- **Rollback:** \`$ROLLBACK_TAG\`"
            fi
            if [ -n "${{ vars.PUBLIC_URL }}" ]; then
              echo "- **URL pública:** ${{ vars.PUBLIC_URL }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verificar-post-deploy:
    name: Verificación post-despliegue
    needs: [resolver, deploy]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.resolver.outputs.ambiente }}
    steps:
      - name: Verificar endpoint de salud público
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -n "$PUBLIC_URL" ]; then
            echo "Verificando salud pública en $PUBLIC_URL/health"
            curl -fsS --max-time 15 "$PUBLIC_URL/health" || echo "Aviso: Host no accesible directamente desde runner hosted (el smoke autoritativo corrió en el host)."
          else
            echo "PUBLIC_URL no definida para este ambiente; verificación externa omitida."
          fi
