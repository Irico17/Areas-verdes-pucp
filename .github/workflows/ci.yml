name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "rc-*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Construir imágenes (verificación con caché)
        run: |
          docker buildx build -f backend/dockerfile -t campus-verde-api:ci .
          docker buildx build -f frontend/Dockerfile -t campus-verde-web:ci .

  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias, lint, pruebas y build
        working-directory: frontend
        run: |
          npm ci
          npx oxlint --max-warnings 0
          npm test
          npx tsc -b && npx vite build

  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: backend/app/go.mod
          cache: true
          cache-dependency-path: backend/app/go.sum
      - name: gofmt, vet y tests
        working-directory: backend/app
        env:
          MIGRATE_TEST_URL: postgres://campus:campus@localhost:5432/campus?sslmode=disable
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Esquema y documentación sin deriva
        env:
          ESQUEMA_ADMIN_URL: postgres://campus:campus@localhost:5432/postgres?sslmode=disable
          CAMPUS_DEV_PASSWORD: clave-demo-local
        run: bash scripts/generar-esquema-bd.sh --comprobar
      - name: Prohibir AutoMigrate, borrados en migraciones nuevas e initdb
        run: |
          if grep -RIn --include='*.go' -E 'AutoMigrate[[:space:]]*\(' backend; then
            echo "AutoMigrate está prohibido"
            exit 1
          fi
          python3 - << 'PY'
          import re
          from pathlib import Path

          root = Path(".")
          destructive = re.compile(
              r"(?i)\b(?:DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE|DELETE\s+FROM)\b"
          )
          checked = 0
          bases = [root / "db/migrations"]
          for base in bases:
              if not base.is_dir():
                  continue
              for path in sorted(base.glob("*.sql")):
                  match = re.match(r"(\d+)", path.name)
                  if not match or int(match.group(1)) < 3:
                      continue
                  checked += 1
                  text = path.read_text(encoding="utf-8")
                  hit = destructive.search(text)
                  if hit:
                      raise SystemExit(
                          f"migración nueva no puede borrar datos ({hit.group(0)}): {path}"
                      )
          if checked == 0:
              print("sin migraciones >= 003 todavía; el chequeo queda activo")
          else:
              print(f"revisadas {checked} migraciones >= 003 (DROP/TRUNCATE/DELETE FROM, sin importar mayúsculas)")

          compose_paths = []
          for pattern in ("docker-compose*.yml", "docker-compose*.yaml", "compose*.yml", "compose*.yaml"):
              compose_paths.extend(root.glob(pattern))
              compose_paths.extend(root.glob("**/" + pattern))
          compose_paths.append(root / "infra/terraform/user_data.sh.tftpl")
          seen = set()
          reviewed = 0
          for path in compose_paths:
              if not path.is_file():
                  continue
              resolved = path.resolve()
              if resolved in seen or "node_modules" in path.parts:
                  continue
              seen.add(resolved)
              reviewed += 1
              text = path.read_text(encoding="utf-8")
              if "docker-entrypoint-initdb" in text:
                  raise SystemExit(f"{path} monta docker-entrypoint-initdb.d")
              for line in text.splitlines():
                  stripped = line.strip()
                  if ".sql" in stripped and ("volumes" in stripped or stripped.startswith("-")):
                      raise SystemExit(f"{path} parece montar un .sql: {stripped}")
          if reviewed == 0:
              raise SystemExit("no se encontró ningún compose para revisar initdb")
          print(f"compose sin initdb ({reviewed} archivos)")

          seed = root / "deploy" / "seed"
          if not seed.is_dir():
              raise SystemExit("falta deploy/seed")
          seeded = 0
          for path in sorted(seed.glob("*.sql")):
              seeded += 1
              text = path.read_text(encoding="utf-8")
              hit = destructive.search(text)
              if hit:
                  raise SystemExit(
                      f"semilla no puede borrar datos ({hit.group(0)}): {path}"
                  )
          if seeded == 0:
              raise SystemExit("deploy/seed no tiene SQL de semilla ficticia")
          print(f"semilla ficticia sin borrado ({seeded} archivos)")
          PY
      - name: Selftests de scripts de despliegue
        run: |
          python3 deploy/patch_compose.py --selftest
          python3 deploy/comparar_conteos.py --selftest
          bash deploy/test_deploy_orden.sh
          bash deploy/test_host_deploy.sh
          bash deploy/test_smoke_tls.sh
          bash deploy/tls/test_nginx_tls.sh
          bash scripts/tests/test-parsear-bloque-credenciales-aws.sh
      - name: Swagger sin deriva
        working-directory: backend/app
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/main.go -o docs/
          git diff --exit-code -- docs

  escaneo:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Escaneo Trivy fs (sistema de archivos, no bloqueante)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" ghcr.io/aquasecurity/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 /src > trivy-fs.txt 2>&1 || true
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Construir imágenes para escaneo
        run: |
          docker buildx build \
            -f backend/dockerfile \
            -t campus-verde-api:scan \
            --label "org.opencontainers.image.source=https://github.com/Irico17/Areas-verdes-pucp" \
            --load \
            .
          docker buildx build \
            -f frontend/Dockerfile \
            -t campus-verde-web:scan \
            --label "org.opencontainers.image.source=https://github.com/Irico17/Areas-verdes-pucp" \
            --load \
            .
      - name: Escaneo Trivy image (API, no bloqueante)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache" ghcr.io/aquasecurity/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --severity HIGH,CRITICAL --exit-code 0 campus-verde-api:scan > trivy-api.txt 2>&1 || true
      - name: Escaneo Trivy image (Web, no bloqueante)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache" ghcr.io/aquasecurity/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --severity HIGH,CRITICAL --exit-code 0 campus-verde-web:scan > trivy-web.txt 2>&1 || true
      - name: Resumen de escaneo en step summary
        if: always()
        run: |
          {
            echo "## Resumen de escaneo de seguridad (no bloqueante)"
            echo ""
            if [ -s trivy-fs.txt ]; then
              echo "### Trivy fs (vuln, secret, config - HIGH, CRITICAL)"
              echo '```text'
              cat trivy-fs.txt
              echo '```'
            fi
            if [ -s trivy-api.txt ]; then
              echo "### Trivy image: API (HIGH, CRITICAL)"
              echo '```text'
              cat trivy-api.txt
              echo '```'
            fi
            if [ -s trivy-web.txt ]; then
              echo "### Trivy image: Web (HIGH, CRITICAL)"
              echo '```text'
              cat trivy-web.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  imagenes:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/backend/arquitectura-equipo' || startsWith(github.ref, 'refs/tags/rc-'))
    needs: [test, backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Iniciar sesión en GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Construir y publicar imágenes con el SHA
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          sha="${GITHUB_SHA}"
          api="ghcr.io/${owner}/campus-verde-api"
          web="ghcr.io/${owner}/campus-verde-web"

          tags_api=("-t" "${api}:${sha}")
          tags_web=("-t" "${web}:${sha}")
          if [[ "$GITHUB_REF" == refs/tags/rc-* ]]; then
            tags_api+=("-t" "${api}:${GITHUB_REF_NAME}")
            tags_web+=("-t" "${web}:${GITHUB_REF_NAME}")
          fi

          docker buildx build \
            -f backend/dockerfile \
            "${tags_api[@]}" \
            --label "org.opencontainers.image.source=https://github.com/Irico17/Areas-verdes-pucp" \
            --cache-from type=registry,ref="${api}:buildcache" \
            --cache-to type=registry,ref="${api}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --push \
            .

          docker buildx build \
            -f frontend/Dockerfile \
            "${tags_web[@]}" \
            --label "org.opencontainers.image.source=https://github.com/Irico17/Areas-verdes-pucp" \
            --cache-from type=registry,ref="${web}:buildcache" \
            --cache-to type=registry,ref="${web}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --push \
            .

          echo "API ${api}:${sha}"
          echo "WEB ${web}:${sha}"

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: backend/app/go.mod
          cache: true
          cache-dependency-path: backend/app/go.sum
      - name: Compilar migrate y la API
        working-directory: backend/app
        run: |
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/api" ./cmd
      - name: Aplicar migraciones y semilla ficticia
        env:
          DATABASE_URL: postgres://campus:campus@localhost:5432/campus?sslmode=disable
          MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
          SEED_FILE: ${{ github.workspace }}/deploy/seed/ficticio.sql
          CAMPUS_DEV_PASSWORD: pando-local
        run: |
          "$RUNNER_TEMP/migrate"
          "$RUNNER_TEMP/migrate" -semilla-ficticia
      - name: Arrancar la API
        env:
          DATABASE_URL: postgres://campus:campus@localhost:5432/campus?sslmode=disable
          API_ADDR: 127.0.0.1:8091
          CAMPUS_COOKIE_SECURE: "false"
          CAMPUS_DEV_PASSWORD: pando-local
          CAMPUS_LOGIN_MAX: "1000"
        run: |
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8091/health >/dev/null; then
              echo "API lista"
              exit 0
            fi
            sleep 1
          done
          echo "la API no respondió en /health" >&2
          cat "$RUNNER_TEMP/api.log" >&2 || true
          exit 1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Caché de Chromium de Playwright
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.63.0-${{ hashFiles('frontend/package-lock.json') }}
      - name: Instalar dependencias y Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo
        working-directory: frontend
        env:
          CI: "true"
          VITE_DEV_API: http://127.0.0.1:8091
        run: npm run test:e2e
      - name: Informe y trazas si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
