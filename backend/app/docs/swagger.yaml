  /v1/accesos/permisos:
    patch:
      consumes:
      - application/json
      description: Concede o retira una acción. Permite lo lee sin reiniciar.
      parameters:
      - description: Celda de la matriz
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/requests.ActualizarPermisoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: acción inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: su rol no tiene ese permiso
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar un permiso
      tags:
      - Accesos
  /v1/accesos/roles:
    post:
      consumes:
      - application/json
      description: Crea un rol sin renombrar los códigos existentes
      parameters:
      - description: Código y nombre
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/requests.CrearRolRequest'
      produces:
      - application/json
      responses:
        "201":
          description: rol creado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: código inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: su rol no tiene ese permiso
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: el rol ya existe
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Alta de rol
      tags:
      - Accesos
  /v1/accesos/roles/{codigo}:
    patch:
