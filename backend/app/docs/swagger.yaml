        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/requests.ActualizarRolRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: JSON inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: su rol no tiene ese permiso
