server {
  listen 80;
  # `_` conserva el acceso por IP (health del timer y del lab).
  server_name verde-pucp.duckdns.org _;

  # El timer local pide http://127.0.0.1/health sin seguir redirecciones.
  location = /health {
    proxy_pass http://api:8091/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name verde-pucp.duckdns.org _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;

  include /etc/nginx/snippets/campus-headers.conf;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    proxy_pass http://api:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /areas-verdes/ {
    proxy_pass http://api:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /health {
    proxy_pass http://api:8091/health;
  }

  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
