# Campus Verde. `docker compose up -d db` es la base local.
# `docker compose up -d --build` levanta PostGIS, la API y nginx en el mismo origen.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: campus-verde-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus_verde}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campus_verde_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@db:5432/${POSTGRES_DB:-campus_verde}?sslmode=disable
      CAMPUS_DEV_PASSWORD: ${CAMPUS_DEV_PASSWORD:-pando-local}
      EVIDENCIAS_BUCKET: ${EVIDENCIAS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - campus_verde_data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8091:8091"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  campus_verde_pg:
  campus_verde_data:
