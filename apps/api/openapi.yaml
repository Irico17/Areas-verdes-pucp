openapi: 3.0.3
info:
  title: Campus Verde API
  version: 0.1.0
  description: |
    API del sistema de gestión de áreas verdes (PUCP / DP2).
    Monolito modular Go + Gin + GORM. El mapa es un cliente de estas rutas;
    no hay un segundo backend geo ni GeoServer.

    CRS de las geometrías: **EPSG:4326** (longitud, latitud), GeoJSON RFC 7946.
    La columna `geom` admite NULL (catastro progresivo, sin GPS).

    Fases A–F: salud, catastro, labores, relieve y overlays de inventario.
    La sesión de la PWA es una cookie HttpOnly de cuentas locales.
    Si la cookie viene, el rol del cuerpo se ignora. Sin cookie, `actor_rol` sigue valiendo
    para las labores (compatibilidad del piloto). No hay SSO.
    La agenda de reservas es un mock ficticio y no consulta hojas de cálculo.
servers:
  - url: http://127.0.0.1:8091
    description: Desarrollo local
tags:
  - name: sistema
  - name: catastro
  - name: operacion
paths: {}
# Los paths no viven aquí. Cada frente añade el suyo en openapi/<tag>.yaml
# (sistema, accesos, catalogos, catastro, inventario, reservas, operacion,
# atencion, reportes). El GET /api/v1/openapi.yaml los une al servir.
# Un frente nuevo crea openapi/<tag>.yaml y no reordena este archivo.
components:
  parameters:
    bbox:
      name: bbox
      in: query
      required: false
      description: minLon,minLat,maxLon,maxLat en EPSG:4326. Filtra por intersección.
      schema:
        type: string
        example: "-77.09,-12.08,-77.07,-12.06"
    limit:
      name: limit
      in: query
      required: false
      description: Máximo de features (1–10000). Sin el parámetro se devuelve la colección completa.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        service:
          type: string
        database:
          type: string
          enum: [up, down]
        postgis:
          type: string
    Resumen:
      type: object
      properties:
        crs:
          type: string
          example: EPSG:4326
        areas:
          type: integer
        areas_con_geometria:
          type: integer
        zonas:
          type: integer
        zonas_con_geometria:
          type: integer
        capas:
          type: array
          items:
            $ref: "#/components/schemas/CapaCount"
    CapaCount:
      type: object
      properties:
        capa:
          type: string
        features:
          type: integer
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        name:
          type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
    Feature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          description: feature_id estable (AV-NNNN, Z-NNNN, JR-NNNN, XE-NNNN)
        geometry:
          nullable: true
          description: MultiPolygon EPSG:4326, o null si aún no hay GPS
        properties:
          type: object
          properties:
            id:
              type: integer
            feature_id:
              type: string
            source_index:
              type: integer
            codigo:
              type: string
            nombre:
              type: string
            uso:
              type: string
            proy_riego:
              type: string
            riego_act:
              type: string
            referencia:
              type: string
            perimetro_m:
              type: number
            area_m2:
              type: number
            capa:
              type: string
            clase:
              type: string
            pertenecen:
              type: string
              description: Unidad organizacional, no una persona
