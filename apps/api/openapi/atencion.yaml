# Frente: 2A solicitudes, órdenes y riego. 1D evidencias si el path es nuevo.
# Añade paths en este archivo. No edites el YAML de otro tag.
/api/v1/solicitudes:
  get:
    tags: [operacion]
    summary: Solicitudes con código externo conservado, no generado
    responses:
      "200":
        description: Lista
  post:
    tags: [operacion]
    summary: Alta manual (Centuria, OSG, correo o interna)
    responses:
      "201":
        description: Solicitud creada
/api/v1/ordenes:
  post:
    tags: [operacion]
    summary: Orden de servicio para una labor tercerizada
    responses:
      "201":
        description: Orden creada
/api/v1/riego:
  get:
    tags: [operacion]
    summary: Riego por sector y turno, sin indicador oficial
    responses:
      "200":
        description: Registros
/api/v1/evidencias:
  get:
    tags: [atencion]
    summary: Metadatos de evidencias de una labor
    parameters:
      - name: actividad_id
        in: query
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: Lista
  post:
    tags: [atencion]
    summary: Adjuntar evidencia con hash, punto opcional y EXIF
    description: |
      Multipart. Campos: id (UUID de la evidencia, distinto de la labor),
      actividad_id, orden_id (opcional, UUID de una orden de esa labor),
      archivo, sha256 (hex), nota, lat, lon,
      exif (solo fecha, lat, lon y orientacion; el resto se descarta; tope 1 KB).
      El servidor recalcula el SHA-256. El mismo id con el mismo hash es idempotente (200).
      El mismo id con otro contenido responde 409. Tope 8 MB. MIME por contenido.
    responses:
      "201":
        description: Evidencia guardada y evento de bitácora tipo evidencia
      "200":
        description: El mismo archivo ya estaba registrado
      "409":
        description: Ese UUID ya existe con otro contenido
/api/v1/evidencias/{id}/archivo:
  get:
    tags: [atencion]
    summary: Descarga el archivo con sesión y permiso consultar
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: Binario
      "404":
        description: No existe
