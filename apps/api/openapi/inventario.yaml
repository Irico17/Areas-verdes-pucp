# Frente: 2B inventario. Tachos, bebederos y capas de punto.
# Añade paths en este archivo. No edites el YAML de otro tag.
/api/v1/geo/inventario:
  get:
    tags: [catastro]
    summary: Catálogo de overlays de inventario
    responses:
      "200":
        description: Capas conocidas y conteos cargados
/api/v1/geo/inventario/{capa}:
  get:
    tags: [catastro]
    summary: Capa opcional de inventario
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
          enum: [bebederos, fauna, playas_estacionamiento, puertas, area_vereda_peligro, flora, cafetos, tachos, xerofitica, jardines_reserva, puntos_pucp]
    responses:
      "200":
        description: FeatureCollection
      "404":
        description: Capa desconocida
/api/v1/inventario/tachos:
  get:
    tags: [catastro]
    summary: Tachos con los 11 conteos
    responses:
      "200":
        description: Lista
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta o edición de un tacho
    responses:
      "201":
        description: Guardado
      "401":
        description: Sin sesión
/api/v1/inventario/bebederos:
  get:
    tags: [catastro]
    summary: Bebederos con estado y sede
    responses:
      "200":
        description: Lista
/api/v1/inventario/puntos:
  get:
    tags: [catastro]
    summary: Puntos PUCP sin teléfono ni placeId
    parameters:
      - name: q
        in: query
        schema:
          type: string
    responses:
      "200":
        description: Lista filtrable por título
  post:
    tags: [catastro]
    summary: Alta de un punto. Rechaza teléfono, placeId y website
    responses:
      "201":
        description: Guardado
      "400":
        description: Datos de contacto
/api/v1/inventario/tachos/{id}:
  patch:
    tags: [catastro]
    summary: Edita un tacho, su geometría y los 11 conteos
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Actualizado
  delete:
    tags: [catastro]
    summary: Baja lógica de un tacho
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Inactivo
/api/v1/inventario/bebederos/{id}:
  patch:
    tags: [catastro]
    summary: Edita estado, sede y geometría de un bebedero
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Actualizado
  delete:
    tags: [catastro]
    summary: Baja lógica de un bebedero
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Inactivo
/api/v1/inventario/puntos/{id}:
  patch:
    tags: [catastro]
    summary: Edita un punto. Rechaza teléfono, placeId y website
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Actualizado
      "400":
        description: Datos de contacto
  delete:
    tags: [catastro]
    summary: Baja lógica de un punto
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Inactivo
/api/v1/inventario/formato/puntos:
  post:
    tags: [catastro]
    summary: Formato CSV de puntos. Omite columnas de contacto. La herramienta genérica es el frente 3A.
    responses:
      "200":
        description: Filas y columnas omitidas por datos personales
/api/v1/inventario/reservas:
  get:
    tags: [catastro]
    summary: Reservas ficticias. desde y hasta vacíos no se castean a date. No abre la hoja institucional.
    parameters:
      - name: desde
        in: query
        schema:
          type: string
      - name: hasta
        in: query
        schema:
          type: string
    responses:
      "200":
        description: origen ficticio
  post:
    tags: [catastro]
    summary: Alta ficticia. Rechaza origen distinto de ficticio.
    responses:
      "201":
        description: Guardada
      "400":
        description: Origen no ficticio
/api/v1/inventario/reservas/{id}:
  patch:
    tags: [catastro]
    summary: Edita una reserva ficticia
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Actualizada
      "400":
        description: Origen no ficticio
  delete:
    tags: [catastro]
    summary: Baja lógica de una reserva ficticia
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Inactiva
/api/v1/inventario/capas/{capa}:
  get:
    tags: [catastro]
    summary: Fauna, puertas, playas, vereda, xerofítica o jardín de reserva
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
          enum: [fauna, puertas, playas_estacionamiento, veredas_riesgo, xerofiticas, jardines_reserva]
    responses:
      "200":
        description: Fichas editables
  post:
    tags: [catastro]
    summary: Alta o edición de geometría y atributos
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
    responses:
      "201":
        description: Guardada
/api/v1/inventario/capas/{capa}/{id}:
  patch:
    tags: [catastro]
    summary: Edita geometría y campos 4.13 (código, nota, clase, riego, área, perímetro, pertenecen)
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
          enum: [fauna, puertas, playas_estacionamiento, veredas_riesgo, xerofiticas, jardines_reserva]
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Actualizada
  delete:
    tags: [catastro]
    summary: Baja lógica de una ficha 4.13
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Inactiva
