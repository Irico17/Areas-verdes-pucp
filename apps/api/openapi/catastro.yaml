# Frente: 1A
# Añade paths en este archivo. No edites el YAML de otro tag.
/api/v1/geo/resumen:
  get:
    tags: [catastro]
    summary: Conteos de áreas, zonas y capas auxiliares
    operationId: resumenCatastro
    responses:
      "200":
        description: Conteos
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resumen"
      "503":
        description: Base no disponible
/api/v1/geo/areas:
  get:
    tags: [catastro]
    summary: Áreas verdes
    description: FeatureCollection de `areas_verdes`. Identificador estable `AV-NNNN`.
    operationId: areas
    parameters:
      - $ref: "#/components/parameters/bbox"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: FeatureCollection
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/FeatureCollection"
      "400":
        description: bbox o limit inválidos
      "503":
        description: Base no disponible
/api/v1/geo/zonas:
  get:
    tags: [catastro]
    summary: Zonas de catastro
    description: |
      FeatureCollection derivada de `jefe_de_grupo.json`.
      El campo `jefes` (nombres de personas) no se almacena ni se sirve.
      Identificador estable `Z-NNNN`.
    operationId: zonas
    parameters:
      - $ref: "#/components/parameters/bbox"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: FeatureCollection
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/FeatureCollection"
      "400":
        description: bbox o limit inválidos
      "503":
        description: Base no disponible
/api/v1/geo/capas:
  get:
    tags: [catastro]
    summary: Catálogo de capas auxiliares
    operationId: capas
    responses:
      "200":
        description: Capas conocidas y conteos cargados
        content:
          application/json:
            schema:
              type: object
              properties:
                capas_conocidas:
                  type: array
                  items:
                    type: string
                cargadas:
                  type: array
                  items:
                    $ref: "#/components/schemas/CapaCount"
/api/v1/geo/capas/{capa}:
  get:
    tags: [catastro]
    summary: Capa auxiliar
    description: "`jardines_reserva` o `xerofitica`."
    operationId: capa
    parameters:
      - name: capa
        in: path
        required: true
        schema:
          type: string
          enum: [jardines_reserva, xerofitica]
      - $ref: "#/components/parameters/bbox"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: FeatureCollection
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/FeatureCollection"
      "404":
        description: Capa desconocida
      "503":
        description: Base no disponible
/api/v1/geo/edificios:
  get:
    tags: [catastro]
    summary: Huellas OSM del recinto para extrusión
    responses:
      "200":
        description: FeatureCollection, vacía si falta el extracto
/api/v1/catastro/areas:
  get:
    tags: [catastro]
    summary: Fichas para editar metadatos
    responses:
      "200":
        description: Hasta 40 áreas
  post:
    tags: [catastro]
    summary: Crea un área sin geometría
    responses:
      "201":
        description: Ficha creada
/api/v1/catastro/zonas-supervision:
  get:
    tags: [catastro]
    summary: Zonas de supervisión Z1–Z4
    operationId: listarZonasSupervision
    responses:
      "200":
        description: Zonas activas
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta de una zona Z1–Z4 con geometría
    operationId: crearZonaSupervision
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [codigo, nombre, geojson]
            properties:
              codigo:
                type: string
                enum: [Z1, Z2, Z3, Z4]
              nombre:
                type: string
              area_m2:
                type: number
              geojson:
                type: string
    responses:
      "201":
        description: Zona creada
      "400":
        description: Código, nombre o geometría inválidos
      "401":
        description: Sin sesión
/api/v1/catastro/poligonos:
  get:
    tags: [catastro]
    summary: Polígonos de cuadrilla
    description: La vista `zonas` sigue sirviendo la misma geometría.
    operationId: listarPoligonos
    responses:
      "200":
        description: Polígonos activos
      "401":
        description: Sin sesión
/api/v1/catastro/cuadrillas:
  get:
    tags: [catastro]
    summary: Cuadrillas ficticias
    operationId: listarCuadrillas
    responses:
      "200":
        description: Equipos activos
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta de una cuadrilla ficticia
    operationId: crearCuadrilla
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id, nombre_ficticio, turno]
            properties:
              id:
                type: string
              nombre_ficticio:
                type: string
              turno:
                type: string
                enum: [manana, tarde]
    responses:
      "201":
        description: Cuadrilla creada
      "400":
        description: Datos inválidos
      "401":
        description: Sin sesión
/api/v1/catastro/lugares:
  get:
    tags: [catastro]
    summary: Lugares del campus
    operationId: listarLugares
    responses:
      "200":
        description: Lugares activos
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta de un lugar
    operationId: crearLugar
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre, lat, lon]
            properties:
              nombre:
                type: string
              lat:
                type: number
              lon:
                type: number
              zona_supervision_id:
                type: integer
    responses:
      "201":
        description: Lugar creado
      "400":
        description: Nombre o coordenada fuera del campus
      "401":
        description: Sin sesión
/api/v1/catastro/especies:
  get:
    tags: [catastro]
    summary: Especies
    operationId: listarEspecies
    responses:
      "200":
        description: Especies activas
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta de una especie
    operationId: crearEspecie
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nombre_cientifico]
            properties:
              nombre_cientifico:
                type: string
              nombre_comun:
                type: string
    responses:
      "201":
        description: Especie creada
      "400":
        description: Nombre científico vacío o repetido
      "401":
        description: Sin sesión
/api/v1/catastro/ejemplares:
  get:
    tags: [catastro]
    summary: Ejemplares de flora
    description: |
      salud permanece null. Sin query `limit` devuelve el total completo y el campo `total`.
      Con `limit` (1 a 2000) y `offset` pagina. El historial de códigos es /codigos.
    operationId: listarEjemplares
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2000
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
    responses:
      "200":
        description: Lista usable. `total` es el conteo completo, no el tamaño de la página.
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Alta de un ejemplar
    operationId: crearEjemplar
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              numero_origen:
                type: integer
              codigo:
                type: string
              especie_id:
                type: integer
              nombre_comun:
                type: string
              tipo_vegetacion:
                type: string
              cantidad:
                type: integer
                minimum: 1
              ubicacion_lugar_id:
                type: integer
              referencia:
                type: string
              lat:
                type: number
              lon:
                type: number
              observacion_fen_2026:
                type: string
    responses:
      "201":
        description: Ejemplar creado. salud queda null.
      "400":
        description: Tipo, cantidad o coordenada inválidos
      "401":
        description: Sin sesión
/api/v1/catastro/ejemplares/{id}/codigos:
  get:
    tags: [catastro]
    summary: Códigos anteriores de un ejemplar
    operationId: listarCodigosEjemplar
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Historial
      "401":
        description: Sin sesión
  post:
    tags: [catastro]
    summary: Conserva el código anterior y escribe el nuevo
    operationId: recodificarEjemplar
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "201":
        description: Código anterior guardado
      "401":
        description: Sin sesión
      "404":
        description: Sin código anterior distinto
