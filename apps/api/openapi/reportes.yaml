# Frente: 2D reportes y 3B sugerencia local. Sin PDF ni KPI nuevo.
# Añade paths en este archivo. No edites el YAML de otro tag.
/api/v1/reportes/labores:
  get:
    tags: [operacion]
    summary: Reporte básico de labores. formato=csv o formato=xls exporta el mismo filtro
    description: |
      Nivel básico (HUID 23 y 25). CSV con BOM y SpreadsheetML, no xlsx y no PDF.
      Columnas que ya existen: id, titulo, tipo, estado, ejecutor, equipo, zona,
      codigo_externo, fuente, creada, clase, lugar, cuadrilla (nombre ficticio),
      fecha_solicitud y fecha_atencion.
      Fuera de este reporte, pendientes de validación en el backlog y por eso
      ausentes: horas de personal, superficie, cobertura, rendimiento, métricas
      de proveedor, responsable real, mes derivado, y los niveles intermedio y
      avanzado. No hay indicador oficial ni PDF.
      El JSON trae por_estado (conteos operativos) y pendientes, tres huecos
      con estado «definición pendiente»: cobertura, rendimiento y métricas de
      proveedor. Esos campos no traen número ni meta.
      Filtros: estado, zona (código Z1–Z4, id de supervisión o zona_feature_id;
      también la zona del lugar), cuadrilla (id o nombre ficticio), origen
      (actividades.origen) y fechas desde/hasta (AAAA-MM-DD) sobre el intervalo
      solicitud–atención, o la fecha de alta si la labor no tiene esas fechas.
    parameters:
      - name: formato
        in: query
        schema: { type: string, enum: [csv, xls] }
      - name: estado
        in: query
        schema: { type: string }
      - name: zona
        in: query
        schema: { type: string, example: Z1 }
      - name: cuadrilla
        in: query
        description: Id de cuadrilla o nombre ficticio. No filtra por persona real.
        schema: { type: string }
      - name: origen
        in: query
        schema: { type: string, example: monitoreo }
      - name: desde
        in: query
        schema: { type: string, example: "2026-09-01" }
      - name: hasta
        in: query
        schema: { type: string }
    responses:
      "200":
        description: JSON, CSV o SpreadsheetML del nivel básico
      "400":
        description: Fecha que no usa AAAA-MM-DD
/api/v1/ia/sugerir-tipo:
  post:
    tags: [operacion]
    summary: Regla local sobre el título. No llama a un modelo externo
    responses:
      "200":
        description: Sugerencia que una persona debe confirmar
