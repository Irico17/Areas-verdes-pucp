# Frente: 1B y 2A labores. Actividades y bitácora.
# El listado y el alta de /operacion/actividades están en o3-mapa-filtros.yaml
# para no repetir el path. La ficha sigue aquí.
/api/v1/operacion/actividades/{id}/ficha:
  patch:
    tags: [operacion]
    summary: Guarda clase, fechas, lugar y comentario de una labor
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: Ficha guardada
