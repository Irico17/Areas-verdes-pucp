server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data: https://demotiles.maplibre.org; connect-src 'self' https://tile.openstreetmap.org https://demotiles.maplibre.org; worker-src 'self' blob:; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8091/health;
  }

  # El worker de MapLibre es un módulo. Si falta, no caer en index.html:
  # el navegador lo ejecuta como script y el catastro no se dibuja.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
