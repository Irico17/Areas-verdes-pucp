# develop: Swagger encendido, logs de depuración, misma carga inicial (ETL de data/raw) que producción si la base está vacía.

services:
  api:
    environment:
      APP_ENV: develop
      SEED_PROFILE: etl
      SERVER_GIN_MODE: debug
      SWAGGER_ENABLED: "true"
      LOG_LEVEL: debug
      LOG_FORMAT: console
      CAMPUS_CORS_ORIGINS: http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:4317,http://localhost:4317
      CAMPUS_COOKIE_SECURE: "false"
      CAMPUS_ENV: develop
