---
# Unidades de TLS o DuckDNS (rama o6) no se crean ni se modifican aquí.
- name: Comprobar si hay systemd en esta máquina
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_base_run
  tags: [systemd]

- name: Recoger las unidades instaladas
  ansible.builtin.service_facts:
  when: systemd_base_run.stat.exists
  tags: [systemd]

- name: Habilitar Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when:
    - systemd_base_run.stat.exists
    - not (campus_en_contenedor_prueba | default(false) | bool)
  tags: [systemd]

- name: Habilitar el agente SSM
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true
    state: started
  when:
    - systemd_base_run.stat.exists
    - "'amazon-ssm-agent.service' in (ansible_facts.services | default({}))"
  tags: [systemd]
