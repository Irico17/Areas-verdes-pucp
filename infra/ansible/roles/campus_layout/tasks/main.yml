---
- name: La IP pública hace falta para PUBLIC_URL
  ansible.builtin.assert:
    that:
      - public_ip is defined
      - public_ip | length > 0
    quiet: true

- name: Grupo docker
  ansible.builtin.group:
    name: docker
    state: present

- name: Usuario de sistema runner
  ansible.builtin.user:
    name: runner
    comment: Runner de GitHub Actions de VerdePUCP
    shell: /bin/bash
    home: /home/runner
    create_home: true
    system: true
    groups: docker
    append: true

- name: Elegir directorios según el perfil del host
  ansible.builtin.set_fact:
    campus_layout_dirs: "{{ campus_layout_dirs_nonprod if campus_perfil == 'nonprod' else campus_layout_dirs_prod }}"
    campus_layout_hostenvs: "{{ campus_layout_hostenvs_nonprod if campus_perfil == 'nonprod' else [] }}"
  changed_when: false

- name: Crear /opt/campus y los datos de cada ambiente
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ campus_layout_dirs }}"

- name: Crear host.env de develop y qa solo si aún no existe
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/env/host.env.example.{{ item.nombre }}"
    dest: "{{ item.home }}/host.env"
    owner: runner
    group: runner
    mode: "0600"
    force: false
  loop: "{{ campus_layout_hostenvs }}"
  register: campus_layout_hostenv_copy
  when: campus_perfil == 'nonprod'

- name: Apuntar PUBLIC_URL a la IP de esta cuenta en el archivo recién creado
  ansible.builtin.lineinfile:
    path: "{{ item.item.home }}/host.env"
    regexp: '^PUBLIC_URL='
    line: "PUBLIC_URL=http://{{ public_ip }}:{{ item.item.puerto }}"
  loop: "{{ campus_layout_hostenv_copy.results | default([]) }}"
  when:
    - item.changed | default(false)
    - not ansible_check_mode

- name: Plantilla de host.env de producción, sin clave usable
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/env/host.env.example.produccion"
    dest: /opt/campus/host.env.example
    owner: runner
    group: runner
    mode: "0644"
  when: campus_perfil == 'produccion'

- name: Aviso si producción todavía no tiene host.env
  ansible.builtin.stat:
    path: /opt/campus/host.env
  register: campus_layout_prod_env
  when: campus_perfil == 'produccion'

- name: Producción no recibe una clave de ejemplo en host.env
  ansible.builtin.debug:
    msg: >-
      Cree /opt/campus/host.env a partir de /opt/campus/host.env.example
      con una clave de 16 caracteres o más. Este rol no la escribe.
  when:
    - campus_perfil == 'produccion'
    - not (campus_layout_prod_env.stat.exists | default(false))

- name: Marca de configuración, sin fecha para que la segunda corrida no cambie
  ansible.builtin.copy:
    dest: /opt/campus/ANSIBLE_OK
    content: "configurado\n"
    owner: root
    group: root
    mode: "0644"

- name: ¿Ya hay archivo de swap?
  ansible.builtin.stat:
    path: /swapfile
  register: campus_layout_swapfile
  tags: [swap]

- name: Crear swap de 2 GB
  ansible.builtin.command: fallocate -l 2048M /swapfile
  when:
    - campus_habilitar_swap | bool
    - not (campus_layout_swapfile.stat.exists | default(false))
    - not (campus_en_contenedor_prueba | default(false) | bool)
  tags: [swap]

- name: Permisos del swap
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when:
    - campus_habilitar_swap | bool
    - campus_layout_swapfile.stat.exists | default(false) or not (campus_en_contenedor_prueba | default(false) | bool)
  tags: [swap]

- name: Formatear y activar el swap recién creado
  ansible.builtin.command: "{{ item }}"
  loop:
    - mkswap /swapfile
    - swapon /swapfile
  when:
    - campus_habilitar_swap | bool
    - not (campus_layout_swapfile.stat.exists | default(false))
    - not (campus_en_contenedor_prueba | default(false) | bool)
  tags: [swap]

- name: Persistencia del swap
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: "/swapfile none swap sw 0 0"
  when:
    - campus_habilitar_swap | bool
    - not (campus_en_contenedor_prueba | default(false) | bool)
  tags: [swap]
