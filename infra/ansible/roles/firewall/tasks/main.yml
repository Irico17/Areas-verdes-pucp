---
- name: La frontera de red es el security group de Terraform
  ansible.builtin.debug:
    msg: >-
      Este rol no publica Postgres ni la API. Si firewalld no está activo,
      no se abre ningún puerto en el host.

- name: Recoger el estado de los servicios
  ansible.builtin.service_facts:
  when: ansible_facts.service_mgr | default('') == 'systemd'
  tags: [systemd]

- name: Puertos web que el security group ya permite
  ansible.builtin.set_fact:
    firewall_web_ports: "{{ [8088, 8188] if campus_perfil == 'nonprod' else [80] }}"
    firewall_activo: >-
      {{
        (
          (ansible_facts.services | default({}))['firewalld.service']
          | default({})
        ).state | default('') == 'running'
      }}
  changed_when: false

- name: Consultar si el puerto web ya está en firewalld
  ansible.builtin.command: "firewall-cmd --query-port={{ item }}/tcp"
  loop: "{{ firewall_web_ports }}"
  register: firewall_consulta
  changed_when: false
  failed_when: false
  when: firewall_activo | bool
  tags: [systemd]

- name: Abrir solo el puerto web que falte
  ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}/tcp"
  loop: "{{ firewall_consulta.results | default([]) }}"
  when:
    - firewall_activo | bool
    - item.rc | default(0) != 0
  changed_when: true
  tags: [systemd]

- name: Recargar firewalld si hubo cambios
  ansible.builtin.command: firewall-cmd --reload
  when:
    - firewall_activo | bool
    - >-
      firewall_consulta.results | default([])
      | selectattr('rc', 'defined')
      | selectattr('rc', 'ne', 0)
      | list | length > 0
  changed_when: true
  tags: [systemd]
